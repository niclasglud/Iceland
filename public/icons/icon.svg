<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#040a18"/>
      <stop offset="100%" stop-color="#08152e"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00c875"/>
      <stop offset="50%"  stop-color="#00e5b0"/>
      <stop offset="100%" stop-color="#7c5cfc"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00ff9f"/>
      <stop offset="60%"  stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="mtnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e8f4ff"/>
      <stop offset="100%" stop-color="#8ab4d4"/>
    </linearGradient>
    <radialGradient id="glowDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00ff9f" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00ff9f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Solid background — opaque dark navy -->
  <rect width="512" height="512" fill="#040a18"/>
  <!-- Slight lighter top -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="white" opacity="0.8">
    <circle cx="48"  cy="46"  r="2.5"/>
    <circle cx="92"  cy="28"  r="1.8"/>
    <circle cx="148" cy="52"  r="2.2"/>
    <circle cx="195" cy="22"  r="1.6"/>
    <circle cx="258" cy="38"  r="2.8"/>
    <circle cx="318" cy="18"  r="1.9"/>
    <circle cx="372" cy="44"  r="2.0"/>
    <circle cx="428" cy="28"  r="2.4"/>
    <circle cx="472" cy="55"  r="1.7"/>
    <circle cx="72"  cy="105" r="1.5"/>
    <circle cx="165" cy="88"  r="1.8"/>
    <circle cx="235" cy="72"  r="1.4"/>
    <circle cx="304" cy="95"  r="1.6"/>
    <circle cx="445" cy="82"  r="1.9"/>
    <circle cx="500" cy="38"  r="1.5"/>
    <circle cx="22"  cy="130" r="1.4"/>
    <circle cx="490" cy="115" r="1.6"/>
  </g>

  <!-- ── Aurora band 1 — thick main curtain ── -->
  <path d="M -10 148
    C 60 88, 130 118, 200 98
    C 270 78, 330 115, 400 92
    C 445 78, 480 95, 522 80
    L 522 145
    C 480 160, 445 143, 400 157
    C 330 180, 270 143, 200 163
    C 130 183, 60 153, -10 213 Z"
    fill="url(#aurora)" opacity="0.92"/>

  <!-- ── Aurora band 2 — secondary shimmer ── -->
  <path d="M -10 112
    C 70 65, 145 90, 215 75
    C 285 60, 345 92, 415 72
    C 452 62, 488 78, 522 65
    L 522 108
    C 488 121, 452 105, 415 115
    C 345 135, 285 103, 215 118
    C 145 133, 70 108, -10 155 Z"
    fill="url(#aurora2)" opacity="0.6"/>

  <!-- ── Aurora glow on ground ── -->
  <ellipse cx="256" cy="340" rx="280" ry="40" fill="#00c875" opacity="0.06"/>

  <!-- ── Mountain silhouette ── -->
  <path d="M 0 512
    L 0 370
    L 35 340
    L 65 358
    L 95 318
    L 128 342
    L 162 295
    L 196 328
    L 226 298
    L 256 258
    L 286 298
    L 316 278
    L 352 318
    L 380 296
    L 408 320
    L 440 295
    L 468 316
    L 512 288
    L 512 512 Z"
    fill="#0e1c32"/>

  <!-- Mountain highlights (lit by aurora) -->
  <path d="M 256 258
    L 226 298 L 236 298
    L 256 268 L 276 298 L 286 298 Z"
    fill="url(#mtnGrad)" opacity="0.7"/>
  <path d="M 162 295
    L 146 320 L 154 320
    L 162 305 L 170 320 L 178 320 Z"
    fill="#c8e8ff" opacity="0.55"/>
  <path d="M 95 318
    L 83 340 L 90 340
    L 95 328 L 100 340 L 108 340 Z"
    fill="#c8e8ff" opacity="0.4"/>
  <path d="M 440 295
    L 428 318 L 436 318
    L 440 305 L 444 318 L 452 318 Z"
    fill="#c8e8ff" opacity="0.5"/>
  <path d="M 380 296
    L 368 318 L 376 318
    L 380 306 L 384 318 L 392 318 Z"
    fill="#c8e8ff" opacity="0.45"/>

  <!-- ── Camera lens ── -->
  <!-- Outer barrel ring -->
  <circle cx="256" cy="390" r="104" fill="#060e1c"/>
  <circle cx="256" cy="390" r="104" fill="none" stroke="#1e3a5a" stroke-width="3"/>

  <!-- Lens body -->
  <circle cx="256" cy="390" r="90"  fill="#0a1628"/>
  <circle cx="256" cy="390" r="90"  fill="none" stroke="#2a4a6a" stroke-width="2"/>

  <!-- Glass -->
  <circle cx="256" cy="390" r="74"  fill="#0d1e3a"/>

  <!-- Deep blue glass tint -->
  <circle cx="256" cy="390" r="70"  fill="#1040a0" opacity="0.45"/>

  <!-- Aurora reflection inside glass -->
  <ellipse cx="238" cy="375" rx="50" ry="28" fill="#00c875" opacity="0.18" transform="rotate(-20 238 375)"/>
  <ellipse cx="270" cy="400" rx="30" ry="16" fill="#7c5cfc" opacity="0.15" transform="rotate(-20 270 400)"/>

  <!-- Primary specular highlight -->
  <ellipse cx="228" cy="368" rx="24" ry="14" fill="white" opacity="0.22" transform="rotate(-30 228 368)"/>
  <ellipse cx="222" cy="364" rx="10" ry="5"  fill="white" opacity="0.45" transform="rotate(-30 222 364)"/>

  <!-- Aperture inner ring -->
  <circle cx="256" cy="390" r="52"  fill="#060e1c" opacity="0.85"/>
  <circle cx="256" cy="390" r="52"  fill="none" stroke="#1a3050" stroke-width="1.5"/>

  <!-- Aperture blades — 8 blade outline -->
  <g stroke="#1a3050" stroke-width="1" fill="none">
    <ellipse cx="256" cy="390" rx="52" ry="18" transform="rotate(0   256 390)"/>
    <ellipse cx="256" cy="390" rx="52" ry="18" transform="rotate(45  256 390)"/>
    <ellipse cx="256" cy="390" rx="52" ry="18" transform="rotate(90  256 390)"/>
    <ellipse cx="256" cy="390" rx="52" ry="18" transform="rotate(135 256 390)"/>
  </g>

  <!-- Center dark -->
  <circle cx="256" cy="390" r="30" fill="#030810"/>

  <!-- Center aurora dot / sensor glow -->
  <circle cx="256" cy="390" r="16" fill="#00c875" opacity="0.22"/>
  <circle cx="256" cy="390" r="8"  fill="#00ff9f" opacity="0.55"/>
  <circle cx="252" cy="386" r="3"  fill="white"   opacity="0.7"/>

  <!-- Lens rim highlight -->
  <circle cx="256" cy="390" r="104" fill="none" stroke="white" stroke-width="0.8" opacity="0.1"/>
</svg>
